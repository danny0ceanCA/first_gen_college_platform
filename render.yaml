services:
  - type: web
    name: origen-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAINTENANCE_DATABASE_URL
        sync: false
      - key: ORIGEN_COORDINATOR_ACCOUNTS
        value: "true"
      - key: ORIGEN_COORDINATOR_LINKING
        value: "true"
      - key: ORIGEN_BINDER_SHARING
        value: "true"
      # Structured requests: migrations through 099. Keep off pending release verification.
      - key: ORIGEN_REVIEW_REQUESTS
        value: "false"
      # Requires migration 098 and review requests.
      - key: ORIGEN_REVIEW_REQUEST_VOICE
        value: "false"
      # Migration 099: coordinator delivery/response rollout; enable after release verification.
      - key: ORIGEN_REVIEW_REQUEST_DELIVERY
        value: "false"
      # Phase 2 responses, private choices and linked requests: migration 103 and personalization retrieval.
      - key: ORIGEN_REVIEW_RESPONSE_CONTEXT
        value: "false"
      # Phase 3 private updates and explicit sharing: migrations 104–108; keep off through release verification.
      - key: ORIGEN_STUDENT_FOLLOW_UP
        value: "false"
      # Phase 4 evidence foundation: migration 109; writers and assessment are later steps.
      - key: ORIGEN_OUTCOME_EVALUATION
        value: "false"
      - key: ORIGEN_OUTCOME_EVIDENCE
        value: "false"
      # Student-first Phase 7: migration 067; explicit selection and preview only.
      - key: ORIGEN_DERIVED_BINDER_SHARING
        value: "false"
      # Student-first Phase 8: migration 068; student-requested help notices.
      - key: ORIGEN_COORDINATOR_FOLLOW_THROUGH
        value: "false"
      - key: ORIGEN_COORDINATOR_BINDER_VIEWING
        value: "true"
      - key: ORIGEN_COORDINATOR_FEEDBACK
        value: "true"
      - key: ORIGEN_COORDINATOR_VOICE_LINKING
        value: "true"
      - key: ORIGEN_VOICE_PREPARATION
        value: "false"
      - key: ORIGEN_BINDER_JOBS
        value: "false"
      # Enable only after migration 062 and the existing background worker are ready.
      - key: ORIGEN_BINDER_ORGANIZATION
        value: "false"
      # Requires migration 063; recent undo keeps prior text in browser memory only.
      - key: ORIGEN_BINDER_CORRECTIONS
        value: "false"
      # Requires migrations 063/064 and enabled binder corrections.
      - key: ORIGEN_GUIDED_CONVERSATION
        value: "false"
      # Requires migrations through 065 and enabled binder corrections.
      - key: ORIGEN_CONVERSATION_RECOVERY
        value: "false"
      - key: ORIGEN_CONVERSATION_CONTINUITY
        value: "false"
      - key: ORIGEN_PERSONALIZATION_MODE
        value: "on"
      - key: ORIGEN_PERSONALIZATION_RETRIEVAL
        value: "true"
      - key: ORIGEN_PERSONALIZATION_LIVE_WRITES
        value: "true"
      - key: ORIGEN_PERSONALIZATION_ADAPTIVE
        value: "true"
      - key: ORIGEN_PERSONALIZATION_EXTRACTION
        value: "true"
      - key: OPENAI_MODEL_VOICE
        value: gpt-live-1
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH0_DOMAIN
        value: origenedu.us.auth0.com
      - key: AUTH0_AUDIENCE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: origen-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: 'microphone=(self), camera=(), geolocation=(), payment=(), usb=(), screen-wake-lock=(self)'
      - path: /*
        name: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://origen-edu.onrender.com https://api.origenedu.ai https://origenedu.us.auth0.com https://api.openai.com; frame-src https://origenedu.us.auth0.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH0_DOMAIN
        value: origenedu.us.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        value: SvPMuyj1thhZoowDmsvqsQ05qzEntXmd
      - key: VITE_AUTH0_AUDIENCE
        sync: false
