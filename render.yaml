services:
  - type: web
    name: origen-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH0_DOMAIN
        value: dev-0dghf4l675sx6lf3.us.auth0.com
      - key: AUTH0_AUDIENCE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: origen-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH0_DOMAIN
        value: dev-0dghf4l675sx6lf3.us.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        value: KGR1dIEl4G9ZskORHBkvAc1tXaDoCtTt
      - key: VITE_AUTH0_AUDIENCE
        sync: false
