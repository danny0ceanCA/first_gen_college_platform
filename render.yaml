services:
  - type: web
    name: origen-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAINTENANCE_DATABASE_URL
        sync: false
      - key: ORIGEN_COORDINATOR_ACCOUNTS
        value: "true"
      - key: ORIGEN_COORDINATOR_LINKING
        value: "true"
      - key: ORIGEN_BINDER_SHARING
        value: "true"
      - key: ORIGEN_COORDINATOR_BINDER_VIEWING
        value: "true"
      - key: ORIGEN_COORDINATOR_FEEDBACK
        value: "true"
      - key: ORIGEN_COORDINATOR_VOICE_LINKING
        value: "true"
      - key: ORIGEN_VOICE_PREPARATION
        value: "false"
      - key: ORIGEN_BINDER_JOBS
        value: "false"
      - key: ORIGEN_PERSONALIZATION_MODE
        value: "on"
      - key: ORIGEN_PERSONALIZATION_RETRIEVAL
        value: "true"
      - key: ORIGEN_PERSONALIZATION_LIVE_WRITES
        value: "true"
      - key: ORIGEN_PERSONALIZATION_ADAPTIVE
        value: "true"
      - key: ORIGEN_PERSONALIZATION_EXTRACTION
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH0_DOMAIN
        value: origenedu.us.auth0.com
      - key: AUTH0_AUDIENCE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: origen-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: 'microphone=(self), camera=(), geolocation=(), payment=(), usb=(), screen-wake-lock=(self)'
      - path: /*
        name: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://origen-edu.onrender.com https://api.origenedu.ai https://origenedu.us.auth0.com https://api.openai.com; frame-src https://origenedu.us.auth0.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH0_DOMAIN
        value: origenedu.us.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        value: SvPMuyj1thhZoowDmsvqsQ05qzEntXmd
      - key: VITE_AUTH0_AUDIENCE
        sync: false
