  - heading "Orientación universitaria, con tu permiso." [level=1] [ref=e26]
  - paragraph [ref=e27]: Hola,
  - paragraph [ref=e28]: Soy Daniel, de Origen Edu. Ayudamos a estudiantes y familias a explorar opciones universitarias, entender las solicitudes y la ayuda financiera, y planear sus próximos pasos con más confianza.
  - paragraph [ref=e29]: Un estudiante proporcionó este correo para pedir tu permiso como madre, padre o tutor legal para usar Origen. Si la solicitud es de tu hijo o hija, quiero que sepas cómo funciona y decidas si es adecuado para tu familia.
  - text: Revisa la solicitud en un plazo de 48 horas. En la siguiente página puedes aprobarla o rechazarla. Abrir este correo o presionar el botón no otorga permiso. Hasta que se apruebe, los perfiles del estudiante, el micrófono y la IA no estarán disponibles.
  - link "Revisar solicitud" [ref=e30] [cursor=pointer]:
    - /url: https://example.invalid/#guardian/PREVIEW-NOT-A-REAL-APPROVAL
  - paragraph [ref=e31]: "Referencia de la solicitud: PREVIEW-ONLY"
  - heading "Qué se te pide autorizar" [level=2] [ref=e32]
  - paragraph [ref=e33]: Origen Edu, operado por Blueprint Holdings LLC, ofrece orientación universitaria desde el noveno grado. Se te pide autorizar a un adolescente de 13–17 años a usar una cuenta. El estudiante puede proporcionar información de perfil y preguntas universitarias.
  - paragraph [ref=e34]: La voz envía audio y contexto relevante a OpenAI; Origen no guarda grabaciones del micrófono. OpenAI procesa datos según sus condiciones de retención de API aplicables. Origen guarda resúmenes de conversaciones, que pueden incluir contexto personal, y perfiles, planes, notas y hojas de trabajo guardados por el usuario.
  - paragraph [ref=e35]: Los controles de retención y eliminación de resúmenes no eliminan automáticamente esos registros separados. El permiso no vincula cuentas familiares ni permite que tú, una organización de referencia o un coordinador lean conversaciones privadas. Este permiso no autoriza la venta de información personal.
  - paragraph [ref=e36]: Puedes rechazar, retirar el permiso con el enlace separado de este correo o contactar a daniel@origenedu.ai para pedir ayuda o eliminación. Retirarlo detiene el uso permitido posterior; no borra por sí solo los registros existentes.
  - paragraph [ref=e37]: La posesión del correo y tu declaración no verifican de forma concluyente la tutela. El permiso dura 180 días desde la solicitud y después debe renovarse.
  - paragraph [ref=e38]: ¿No reconoces esta solicitud? No la apruebes. Puedes rechazarla en la página de revisión o responderme para pedir ayuda. No reenvíes los enlaces privados.
  - paragraph [ref=e39]: Conserva este correo. Puedes retirar el permiso con el enlace privado que aparece abajo durante los 180 días posteriores a la solicitud. Retirarlo detiene el uso autorizado; eliminar los datos requiere una solicitud aparte.
