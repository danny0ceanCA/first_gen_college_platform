  - paragraph [ref=e6]: Hello,
  - paragraph [ref=e7]: I’m Daniel from Origen Edu. We help students and families explore college options, understand applications and financial aid, and plan their next steps with more confidence.
  - paragraph [ref=e8]: A student has provided this email address to request your permission as their parent or legal guardian to use Origen. If this is your child’s request, I’d like you to understand how it works and decide whether it’s right for your family.
  - text: Please review the request within 48 hours. You can approve or decline on the next page. Opening this email or clicking the button does not grant permission. Until approval, student profiles, microphone use and AI remain unavailable.
