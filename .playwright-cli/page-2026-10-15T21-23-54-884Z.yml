  - heading "What you’re being asked to allow" [level=2] [ref=e11]
  - paragraph [ref=e12]: Origen Edu, operated by Blueprint Holdings LLC, offers college planning for ninth graders and above. You are being asked to permit a teenager aged 13–17 to use an account. The student may provide profile information and college questions.
  - paragraph [ref=e13]: Voice sends audio and relevant context to OpenAI; Origen does not keep microphone recordings. OpenAI processes data under its own applicable API retention settings. Origen saves conversation summaries, which may include personal context, and user-saved profiles, plans, notes and worksheets.
  - paragraph [ref=e14]: Summary retention and deletion controls do not automatically delete those separate records. Permission does not link family accounts or let you, a referring organization, or a coordinator read private conversations. No sale of personal information is authorized by this permission.
  - paragraph [ref=e15]: You can decline, withdraw using the separate link in this email, or contact daniel@origenedu.ai to request help or deletion. Withdrawing stops further permitted use; it does not by itself erase existing records.
  - paragraph [ref=e16]: Email possession and your declaration do not conclusively verify guardianship. Approval lasts 180 days from the request and must then be renewed.
  - paragraph [ref=e17]: Don’t recognize this request? Please don’t approve it. You can decline on the review page or reply to me for help. Do not forward the private links.
  - paragraph [ref=e18]: Keep this email. You can withdraw permission using the separate private link below during the 180-day period from the request. Withdrawal stops further permitted use; deletion is a separate request.
