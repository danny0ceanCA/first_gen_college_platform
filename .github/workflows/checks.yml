name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  telemetry-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEMETRY_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/postgres
      DATABASE_TEST_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:observability
      - run: npm run test:support
      - run: npm run test:diagnostic-agent
      - run: npm run test:diagnostic-runner
      - name: Verify personalization isolation, rollout and migration compatibility
        run: npm run test:personalization
      - name: Measure synthetic retrieval and prepare unrun live evaluation captures
        run: |
          node scripts/evaluate-history-retrieval.mjs --output output/personalization-retrieval.json
          npm run eval:personalization:release -- prepare output/personalization-live
      - name: Save personalization evidence (offline only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personalization-offline-evidence
          path: |
            output/personalization-retrieval.json
            output/personalization-live/
          if-no-files-found: error
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:logging
      - run: npm run check:onboarding
      - run: npm run test:ops
      - name: Save onboarding verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-release-check
          path: output/onboarding-release-check.json
          if-no-files-found: warn
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
