name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:onboarding
      - run: npm run test:ops
      - name: Save onboarding verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-release-check
          path: output/onboarding-release-check.json
          if-no-files-found: warn
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
